<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaSense - Valve Pump Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
html,body{height:100%; overflow:hidden}
body{display:flex; flex-direction:column}
#customerGrid{overflow-y:auto}
#customerGrid::-webkit-scrollbar{width:6px}
#customerGrid::-webkit-scrollbar-thumb{background:#334155; border-radius:10px}
.water-fill{transition:height 0.8s ease; position:absolute; bottom:0; left:0; right:0}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}
</style>
</head>
<body class="bg-slate-900 text-white h-screen">
<div class="flex flex-col h-screen max-w- mx-auto w-full px-3 py-2 gap-2">
<header class="bg-slate-800 rounded-xl px-4 py-2 flex justify-between items-center shrink-0">
<h1 class="text-xl font-bold">AQUASENSE</h1>
<div class="flex gap-3 items-center">
<span id="nodeCount" class="font-bold text-cyan-400">0</span>
<span id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500"></span>
<span id="statusText" class="text-xs">Connecting...</span>
</div>
</header>
<div id="customerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 flex-1 content-start">
<div class="col-span-full bg-slate-800 rounded-xl p-10 text-center">Waiting...</div>
</div>
</div>

<script>
const MQTT_BROKER="wss://broker.hivemq.com:8884/mqtt";
const MQTT_LIVE_TOPIC="aquasense/moses_kaaga_9x7p2/live";
const MQTT_CMD_TOPIC="aquasense/moses_kaaga_9x7p2/cmd";
const TANK_HEIGHT_CM=100;
let mqttClient=null; const nodes={};

function connectMQTT(){
  mqttClient=mqtt.connect(MQTT_BROKER,{reconnectPeriod:3000,connectTimeout:10000,clean:true});
  mqttClient.on("connect",()=>{document.getElementById("statusText").textContent="MQTT Connected"; document.getElementById("statusDot").className="w-2 h-2 rounded-full bg-green-500"; mqttClient.subscribe(MQTT_LIVE_TOPIC);});
  mqttClient.on("message",(t,m)=>{ if(t!==MQTT_LIVE_TOPIC) return; try{ console.log("RX:",m.toString()); processLiveData(JSON.parse(m.toString())); }catch(e){}});
}
function getTankMetrics(node){
  const d=node.ultrasonic??node.ultra??node.distance??node.dist_cm??null;
  const l=node.tank??node.tank_level??node.level??node.water_level??node.tank_percent??null;
  let dist=0,pct=0;
  if(l!==null&&!isNaN(l)){pct=Number(l); dist=d!==null?Number(d):(TANK_HEIGHT_CM-(pct/100)*TANK_HEIGHT_CM);}
  else if(d!==null){dist=Number(d); pct=100-(dist/TANK_HEIGHT_CM*100);}
  pct=Math.max(0,Math.min(100,pct)); return {distanceCm:dist.toFixed(0), levelPct:pct.toFixed(0), levelNum:pct};
}
function processLiveData(data){
  console.log("LIVE DATA:", data);
  if(!data||!Array.isArray(data.nodes)) return;
  data.nodes.forEach(n=>{if(n.id!=null) nodes[n.id]={...n}});
  renderDashboard();
}
function isOnline(n){ return n.online===true||n.online===1||n.online==="true"||n.online==="1"||n.online===undefined; } // default online if not specified for testing
function parseValve(node){
  // read every possible field name
  let v = node.valve?? node.valve_status?? node.valveState?? node.v1?? node.valve1?? node.solenoid?? null;
  if(v===null) return {isOpen:false, text:"CLOSED", raw:"null"};
  let s = String(v).toLowerCase().trim();
  let isOpen = s==="open"||s==="1"||s==="true"||s==="on"||s==="1.0"||s==="open ".trim();
  return {isOpen, text:isOpen?"OPEN":"CLOSED", raw:String(v)};
}
function parsePump(node){
  let p = node.pump?? node.pump_status?? node.pumpState?? node.motor?? null;
  if(p===null) return {isOn:false, text:"OFF", raw:"null"};
  let s = String(p).toLowerCase().trim();
  let isOn = s==="on"||s==="1"||s==="true"||s==="open"||s==="running";
  return {isOn, text:isOn?"ON":"OFF", raw:String(p)};
}

function renderDashboard(){
  document.getElementById("nodeCount").textContent=Object.keys(nodes).length;
  const grid=document.getElementById("customerGrid");
  const ids=Object.keys(nodes);
  if(ids.length===0){ grid.innerHTML=`<div class="col-span-full bg-slate-800 rounded-xl p-10 text-center">Waiting...</div>`; return; }
  grid.innerHTML=ids.map(id=>createNodeCard(nodes[id])).join("");
}

function createNodeCard(node){
  const id=node.id;
  const online=isOnline(node);
  const flow=Number(node.flow||0).toFixed(1);
  const total=Number(node.total||0).toFixed(0);
  const {distanceCm,levelPct,levelNum}=getTankMetrics(node);
  const valveInfo=parseValve(node);
  const pumpInfo=parsePump(node);

  let waterColor="linear-gradient(to top,#22d3ee,#3b82f6)";
  if(levelNum<10) waterColor="linear-gradient(to top,#ef4444,#dc2626)";
  else if(levelNum<30) waterColor="linear-gradient(to top,#f59e0b,#f97316)";

  console.log(`Node ${id} valve=${valveInfo.raw} -> ${valveInfo.text} pump=${pumpInfo.raw} -> ${pumpInfo.text}`);

  return `
  <div class="bg-slate-800 border ${online?'border-slate-700':'border-slate-700 opacity-70'} rounded-xl p-3 flex flex-col h-">
    <div class="flex justify-between items-center mb-2">
      <h2 class="font-bold text-sm">Customer ${id}</h2>
      <span class="text- px-2 py-0.5 rounded-full font-bold ${online?'bg-green-500 text-black':'bg-red-500 text-white'}">${online?'ONLINE':'OFFLINE'}</span>
    </div>

    <!-- BIG VALVE/PUMP STATUS - ALWAYS VISIBLE -->
    <div class="grid grid-cols-2 gap-2 mb-2">
      <div style="background:${valveInfo.isOpen?'#16a34a':'#dc2626'}; border:2px solid ${valveInfo.isOpen?'#4ade80':'#fca5a5'}; border-radius:8px; padding:8px; text-align:center;">
        <p style="font-size:8px; color:white; font-weight:bold; letter-spacing:1px;">VALVE</p>
        <p style="font-size:14px; color:white; font-weight:900; margin-top:2px;">${valveInfo.text}</p>
        <div style="width:12px; height:12px; border-radius:50%; background:white; margin:4px auto 0; box-shadow:0 0 10px white;" class="${valveInfo.isOpen?'pulse':''}"></div>
      </div>
      <div style="background:${pumpInfo.isOn?'#16a34a':'#dc2626'}; border:2px solid ${pumpInfo.isOn?'#4ade80':'#fca5a5'}; border-radius:8px; padding:8px; text-align:center;">
        <p style="font-size:8px; color:white; font-weight:bold; letter-spacing:1px;">PUMP</p>
        <p style="font-size:14px; color:white; font-weight:900; margin-top:2px;">${pumpInfo.text}</p>
        <div style="width:12px; height:12px; border-radius:50%; background:white; margin:4px auto 0; box-shadow:0 0 10px white;" class="${pumpInfo.isOn?'pulse':''}"></div>
      </div>
    </div>

    <div class="grid grid-cols-[1fr_70px] gap-2 mb-2">
      <div class="space-y-1">
        <div class="bg-slate-900 rounded px-2 py-1 flex justify-between"><span class="text- text-slate-400">FLOW</span><span class="text-xs font-bold text-cyan-400">${flow} L/m</span></div>
        <div class="bg-slate-900 rounded px-2 py-1 flex justify-between"><span class="text- text-slate-400">TOTAL</span><span class="text-xs font-bold text-blue-400">${total} L</span></div>
        <div class="bg-slate-900 rounded px-2 py-1 flex justify-between"><span class="text- text-slate-400">TANK</span><span class="text-xs font-bold text-white">${levelPct}% (${distanceCm}cm)</span></div>
      </div>
      <div style="width:70px; height:80px; background:#1e293b; border:2px solid #475569; border-radius:6px 6px 12px 12px; position:relative; overflow:hidden;">
        <div class="water-fill" style="height:${levelPct}%; background:${waterColor};"><div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold
