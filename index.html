<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irrigation Master Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>.pulse-dot{animation:pulse-dot 2s infinite}@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <header class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
    <h1 class="text-3xl font-extrabold tracking-wider uppercase border-b-2 border-cyan-500 pb-2 inline-block">IRRIGATION MASTER DASHBOARD</h1>
    <div class="mt-4 flex items-center justify-center gap-3 text-xs">
      <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 pulse-dot"></span>
        <span id="status-text" class="font-medium text-amber-400">Connecting...</span>
      </div>
      <span class="text-slate-500">Broker: HiveMQ</span>
    </div>
  </header>
  <main><div id="customer-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></main>
</div>
<script>
const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
const MQTT_LIVE_TOPIC = "aquasense/moses_kaaga_9x7p2/live";
const MQTT_CMD_TOPIC = "aquasense/moses_kaaga_9x7p2/cmd";
let mqttClient=null;

document.addEventListener("DOMContentLoaded", () => { lucide.createIcons(); connectMQTT(); });

function updateNetworkStatus(c){
  const dot=document.getElementById("status-dot"), text=document.getElementById("status-text");
  if(c){ dot.className="w-2.5 h-2.5 rounded-full bg-emerald-500"; text.innerText="Connected - MQTT"; text.className="font-medium text-emerald-400"; }
  else { dot.className="w-2.5 h-2.5 rounded-full bg-amber-500 pulse-dot"; text.innerText="Connecting..."; text.className="font-medium text-amber-400"; }
}

function connectMQTT(){
  updateNetworkStatus(false);
  mqttClient = mqtt.connect(MQTT_BROKER);
  mqttClient.on("connect", ()=>{ updateNetworkStatus(true); mqttClient.subscribe(MQTT_LIVE_TOPIC); console.log("MQTT connected"); });
  mqttClient.on("message", (topic, message)=>{
    if(topic===MQTT_LIVE_TOPIC){
      try{ const data=JSON.parse(message.toString()); renderDashboard(data); }catch(e){ console.error(e); }
    }
  });
  mqttClient.on("error", ()=>updateNetworkStatus(false));
  mqttClient.on("close", ()=>updateNetworkStatus(false));
}

function renderDashboard(data){
  const grid=document.getElementById("customer-grid");
  const rawNodes = data.nodes || [];
  const onlineNodes = rawNodes.filter(n=> n.online===true || n.online===1 || n.online==="true");

  if(onlineNodes.length===0){
    grid.innerHTML=`<div class="col-span-full bg-slate-800/40 rounded-xl border border-dashed border-slate-700 p-12 text-center">
      <p class="text-slate-300 font-medium text-lg">Listening for Online Customer Nodes...</p>
      <p class="text-xs text-slate-500 mt-1">Power your LoRa node. Expected format: ID:flow/total/m1/m2/hum/temp/dist</p></div>`;
    return;
  }

  grid.innerHTML = onlineNodes.map((node, idx)=>{
    const nodeId = node.id?? idx+1;
    const totalVolume = (node.total?? 0).toFixed(1);
    const m1 = node.m1?? node.moist1?? 0;
    const m2 = node.m2?? node.moist2?? 0;
    const temp = node.temp?? 0;
    const hum = node.hum?? 0;
    const valveState = (node.valve || "close").toLowerCase();
    const pumpState = (node.pump || "close").toLowerCase();
    const distance = node.distance || 0;
    const fillPct = Math.max(0, Math.min(100, Math.round(100 - distance)));
    const isFull = fillPct >= 90;

    return `<div class="bg-slate-800 border-2 border-slate-700 rounded-2xl p-5 flex flex-col space-y-4 shadow-xl text-center">
      <div class="border-b border-slate-700 pb-2"><h2 class="text-xl font-bold text-white">Customer ${nodeId}</h2><span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 inline-block mt-1">Online • ${node.rssi||0} dBm</span></div>
      <div class="my-2"><div class="text-5xl font-extrabold text-white">${totalVolume}<span class="text-3xl text-cyan-400">L</span></div><p class="text- text-slate-400 uppercase tracking-widest mt-1">Total Flowed Volume • ${node.flow??0} L/min</p></div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-2"><div class="text-slate-400">Moist 1</div><div class="text-base font-bold text-emerald-400">${m1}%</div></div>
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-2"><div class="text-slate-400">Moist 2</div><div class="text-base font-bold text-emerald-400">${m2}%</div></div>
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-2"><div class="text-slate-400">Temp</div><div class="text-base font-bold text-amber-400">${temp}°C</div></div>
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-2"><div class="text-slate-400">Humid</div><div class="text-base font-bold text-cyan-400">${hum}%</div></div>
      </div>
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/80 space-y-2">
        <div class="flex items-center justify-between text-xs px-1"><span class="font-bold text-slate-300">Valve</span><span class="px-2 py-0.5 rounded text- font-bold ${valveState==='open'?'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30':'bg-slate-700 text-slate-400'}">${valveState.toUpperCase()}</span></div>
        <div class="grid grid-cols-2 gap-2"><button onclick="sendCommand({id:${nodeId},cmd:'open'})" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-1.5 rounded-lg text-xs">Open</button><button onclick="sendCommand({id:${nodeId},cmd:'close'})" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-1.5 rounded-lg text-xs border border-slate-600">Close</button></div>
      </div>
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/80 space-y-2">
        <div class="flex items-center justify-between text-xs px-1"><span class="font-bold text-slate-300">Pump</span><span class="px-2 py-0.5 rounded text- font-bold ${pumpState.includes('on')||pumpState==='open'?'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30':'bg-slate-700 text-slate-400'}">${pumpState.toUpperCase()}</span></div>
        <div class="grid grid-cols-2 gap-2"><button onclick="sendCommand({id:${nodeId},cmd:'pump_on'})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 rounded-lg text-xs">Open</button><button onclick="sendCommand({id:${nodeId},cmd:'pump_off'})" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-1.5 rounded-lg text-xs border border-slate-600">Close</button></div>
      </div>
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center gap-3"><div class="w-10 h-20 bg-slate-800 border-2 border-slate-500 rounded-md relative overflow-hidden shrink-0 flex flex-col justify-end"><div class="bg-cyan-500 w-full transition-all duration-500" style="height:${fillPct}%"></div></div><div class="flex-1 text-left space-y-1"><div class="text-xs font-bold text-slate-300">Water Tank</div><div class="text-sm font-extrabold text-cyan-400">${distance} cm</div><span class="inline-block px-2 py-0.5 rounded text- font-bold ${isFull?'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30':'bg-slate-800 text-slate-400 border border-slate-700'}">${isFull?'FULL':fillPct+'% Level'}</span></div></div>
    </div>`;
  }).join("");
  lucide.createIcons();
}

function sendCommand(payload){
  if(mqttClient && mqttClient.connected){
    mqttClient.publish(MQTT_CMD_TOPIC, JSON.stringify(payload));
    console.log("CMD TX", payload);
  } else { alert("MQTT not connected"); }
}
</script>
</body>
</html>
