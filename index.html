<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AquaSense Irrigation Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
}

.card {
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.green-dot {
  background: #22c55e;
  box-shadow: 0 0 8px #22c55e;
}

.red-dot {
  background: #ef4444;
  box-shadow: 0 0 8px #ef4444;
}

.green-status {
  background: rgba(34,197,94,0.15);
  color: #4ade80;
  border-color: rgba(34,197,94,0.5);
}

.red-status {
  background: rgba(239,68,68,0.15);
  color: #f87171;
  border-color: rgba(239,68,68,0.5);
}

.water-fill {
  transition: height 1s ease;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}

.tank-wave {
  position: absolute;
  top: -4px;
  left: 0;
  width: 200%;
  height: 8px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: wave 2s linear infinite;
}

@keyframes wave {

  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-50%);
  }

}

</style>

</head>


<body class="bg-slate-900 text-white min-h-screen">

<div class="max-w-7xl mx-auto px-3 py-3">

<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<header
  class="bg-slate-800 rounded-xl p-4 mb-4
         flex flex-wrap justify-between items-center
         shadow-lg border border-slate-700"
>

<div>

<h1 class="text-2xl font-black text-cyan-400">
AQUASENSE
</h1>

<p class="text-xs text-slate-400">
IRRIGATION MASTER + WATER MANAGEMENT
</p>

</div>


<div class="flex items-center gap-3">

<div
  class="bg-slate-900 px-3 py-2
         rounded-lg border border-slate-700"
>

Active Nodes:

<span
  id="nodeCount"
  class="font-bold text-cyan-400"
>
0
</span>

</div>


<div
  class="flex items-center gap-2
         bg-slate-900 px-3 py-2
         rounded-lg border border-slate-700"
>

<span
  id="statusDot"
  class="dot bg-yellow-500"
></span>

<span
  id="statusText"
  class="text-xs text-slate-300"
>
Connecting...
</span>

</div>

</div>

</header>


<!-- ========================================================= -->
<!-- NODE GRID -->
<!-- ========================================================= -->

<div
  id="customerGrid"
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
>

<div
  class="col-span-full bg-slate-800
         rounded-xl p-10 text-center
         border border-slate-700"
>

<p class="text-slate-400">
Waiting for online nodes...
</p>

</div>

</div>

</div>


<script>

// ============================================================
// MQTT
// ============================================================

const MQTT_BROKER =
  "wss://broker.hivemq.com:8884/mqtt";

const MQTT_LIVE_TOPIC =
  "aquasense/moses_kaaga_9x7p2/live";

const MQTT_CMD_TOPIC =
  "aquasense/moses_kaaga_9x7p2/cmd";


// ============================================================
// GLOBAL VARIABLES
// ============================================================

let mqttClient = null;

const nodes = {};


// ============================================================
// MQTT CONNECTION
// ============================================================

function connectMQTT() {

  updateConnectionStatus(
    false,
    "Connecting..."
  );

  mqttClient = mqtt.connect(
    MQTT_BROKER,
    {
      reconnectPeriod: 3000,
      connectTimeout: 10000,
      clean: true
    }
  );


  // ----------------------------------------------------------
  // CONNECTED
  // ----------------------------------------------------------

  mqttClient.on(
    "connect",
    () => {

      console.log(
        "MQTT connected"
      );

      updateConnectionStatus(
        true,
        "MQTT Connected"
      );


      mqttClient.subscribe(
        MQTT_LIVE_TOPIC,
        (error) => {

          if (error) {

            console.error(
              "Subscribe error:",
              error
            );

          }
          else {

            console.log(
              "Subscribed:",
              MQTT_LIVE_TOPIC
            );
          }
        }
      );

    }
  );


  // ----------------------------------------------------------
  // MESSAGE
  // ----------------------------------------------------------

  mqttClient.on(
    "message",
    (topic, message) => {

      if (
        topic !== MQTT_LIVE_TOPIC
      ) {

        return;
      }


      try {

        const data =
          JSON.parse(
            message.toString()
          );

        processLiveData(data);

      }

      catch (error) {

        console.error(
          "JSON error:",
          error
        );

      }

    }
  );


  // ----------------------------------------------------------
  // ERRORS
  // ----------------------------------------------------------

  mqttClient.on(
    "error",
    (error) => {

      console.error(
        "MQTT error:",
        error
      );

      updateConnectionStatus(
        false,
        "MQTT Error"
      );

    }
  );


  mqttClient.on(
    "offline",
    () => {

      updateConnectionStatus(
        false,
        "Offline"
      );

    }
  );


  mqttClient.on(
    "reconnect",
    () => {

      updateConnectionStatus(
        false,
        "Reconnecting..."
      );

    }
  );

}


// ============================================================
// CONNECTION STATUS
// ============================================================

function updateConnectionStatus(
  connected,
  text
) {

  const dot =
    document.getElementById(
      "statusDot"
    );

  const statusText =
    document.getElementById(
      "statusText"
    );


  statusText.textContent =
    text;


  if (connected) {

    dot.className =
      "dot green-dot";

  }

  else {

    dot.className =
      "dot bg-yellow-500";

  }

}


// ============================================================
// PROCESS LIVE DATA
// ============================================================

function processLiveData(data) {

  if (
    !data ||
    !Array.isArray(data.nodes)
  ) {

    console.warn(
      "Invalid live data",
      data
    );

    return;
  }


  data.nodes.forEach(
    (node) => {

      if (node.id == null) {
        return;
      }


      nodes[node.id] = {

        ...nodes[node.id],

        ...node

      };

    }
  );


  renderDashboard();

}


// ============================================================
// ONLINE CHECK
// ============================================================

function isOnline(node) {

  return (
    node.online === true ||
    node.online === 1 ||
    node.online === "true" ||
    node.online === "1"
  );

}


// ============================================================
// VALVE STATE
// ============================================================

function isValveOpen(node) {

  const value =
    String(
      node.valve
    )
    .toLowerCase()
    .trim();


  return (
    value === "true" ||
    value === "1" ||
    value === "open" ||
    value === "on"
  );

}


// ============================================================
// PUMP STATE
// ============================================================

function isPumpOn(node) {

  const value =
    String(
      node.pump
    )
    .toLowerCase()
    .trim();


  return (
    value === "true" ||
    value === "1" ||
    value === "on" ||
    value === "open"
  );

}


// ============================================================
// RENDER DASHBOARD
// ============================================================

function renderDashboard() {

  const onlineIds =
    Object.keys(nodes)
      .filter(
        id =>
          isOnline(
            nodes[id]
          )
      );


  document.getElementById(
    "nodeCount"
  ).textContent =
    onlineIds.length;


  const grid =
    document.getElementById(
      "customerGrid"
    );


  if (
    onlineIds.length === 0
  ) {

    grid.innerHTML = `

      <div
        class="col-span-full
               bg-slate-800
               rounded-xl
               p-10
               text-center
               border border-slate-700"
      >

        <p class="text-slate-400">
          Waiting for online nodes...
        </p>

      </div>

    `;

    return;
  }


  grid.innerHTML =
    onlineIds
      .map(
        id =>
          createNodeCard(
            nodes[id]
          )
      )
      .join("");

}


// ============================================================
// CREATE NODE CARD
// ============================================================

function createNodeCard(node) {

  const id =
    node.id;


  const online =
    isOnline(node);


  const flow =
    Number(
      node.flow || 0
    ).toFixed(2);


  const total =
    Number(
      node.total || 0
    ).toFixed(2);


  const m1 =
    Number(
      node.m1 ??
      node.moist1 ??
      0
    ).toFixed(0);


  const m2 =
    Number(
      node.m2 ??
      node.moist2 ??
      0
    ).toFixed(0);


  const temp =
    Number(
      node.temp ??
      node.temperature ??
      0
    ).toFixed(1);


  const hum =
    Number(
      node.hum ??
      node.humidity ??
      0
    ).toFixed(1);


  const rssi =
    node.rssi ??
    0;


  // ----------------------------------------------------------
  // ACTUAL STATES
  // ----------------------------------------------------------

  const valveOpen =
    isValveOpen(node);


  const pumpOn =
    isPumpOn(node);


  // ----------------------------------------------------------
  // VALVE COLOURS
  // ----------------------------------------------------------

  const valveClass =
    valveOpen
      ? "green-status"
      : "red-status";


  const valveDot =
    valveOpen
      ? "green-dot"
      : "red-dot";


  const valveText =
    valveOpen
      ? "OPEN"
      : "CLOSED";


  // ----------------------------------------------------------
  // PUMP COLOURS
  // ----------------------------------------------------------

  const pumpClass =
    pumpOn
      ? "green-status"
      : "red-status";


  const pumpDot =
    pumpOn
      ? "green-dot"
      : "red-dot";


  const pumpText =
    pumpOn
      ? "ON"
      : "OFF";


  return `

  <div
    class="card
           bg-slate-800
           border border-slate-700
           rounded-xl
           p-4
           shadow-lg"
  >

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div
      class="flex justify-between items-center
             border-b border-slate-700
             pb-3 mb-3"
    >

      <div>

        <h2
          class="text-lg font-bold"
        >
          Customer ${id}
        </h2>

        <p
          class="text-xs text-slate-400"
        >
          Node ID: #${id}
        </p>

      </div>


      <span
        class="
          px-2 py-1
          rounded-full
          text-[10px]
          font-bold
          ${online
            ? "green-status"
            : "red-status"}
          border
        "
      >

        ${online
          ? "ONLINE"
          : "OFFLINE"}

      </span>

    </div>


    <!-- ================================================= -->
    <!-- FLOW -->
    <!-- ================================================= -->

    <div
      class="grid grid-cols-2 gap-2 mb-3"
    >

      <div
        class="bg-slate-900
               rounded-lg
               p-3
               text-center"
      >

        <p
          class="text-xs text-slate-400"
        >
          FLOW RATE
        </p>

        <p
          class="text-xl
                 font-bold
                 text-cyan-400"
        >

          ${flow}

          <span
            class="text-xs text-slate-400"
          >
            L/min
          </span>

        </p>

      </div>


      <div
        class="bg-slate-900
               rounded-lg
               p-3
               text-center"
      >

        <p
          class="text-xs text-slate-400"
        >
          TOTAL WATER
        </p>

        <p
          class="text-xl
                 font-bold
                 text-blue-400"
        >

          ${total}

          <span
            class="text-xs text-slate-400"
          >
            L
          </span>

        </p>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- SENSORS -->
    <!-- ================================================= -->

    <div
      class="grid grid-cols-4 gap-2 mb-3"
    >

      <div
        class="bg-slate-900
               rounded-lg
               p-2
               text-center"
      >

        <p class="text-[10px] text-slate-400">
          Moist1
        </p>

        <p class="font-bold text-green-400">
          ${m1}%
        </p>

      </div>


      <div
        class="bg-slate-900
               rounded-lg
               p-2
               text-center"
      >

        <p class="text-[10px] text-slate-400">
          Moist2
        </p>

        <p class="font-bold text-green-400">
          ${m2}%
        </p>

      </div>


      <div
        class="bg-slate-900
               rounded-lg
               p-2
               text-center"
      >

        <p class="text-[10px] text-slate-400">
          Temp
        </p>

        <p class="font-bold text-amber-400">
          ${temp}°C
        </p>

      </div>


      <div
        class="bg-slate-900
               rounded-lg
               p-2
               text-center"
      >

        <p class="text-[10px] text-slate-400">
          Hum
        </p>

        <p class="font-bold text-cyan-400">
          ${hum}%
        </p>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- VALVE -->
    <!-- ================================================= -->

    <div
      class="bg-slate-900
             rounded-lg
             p-3
             mb-2
             border border-slate-700"
    >

      <div
        class="flex
               justify-between
               items-center"
      >

        <div
          class="flex
                 items-center
                 gap-2"
        >

          <span
            class="text-sm
                   font-bold
                   text-slate-300"
          >
            VALVE
          </span>


          <span
            class="
              inline-flex
              items-center
              gap-2
              px-2
              py-1
              rounded-full
              border
              text-xs
              font-bold
              ${valveClass}
            "
          >

            <span
              class="dot ${valveDot}"
            ></span>

            ${valveText}

          </span>

        </div>


        <div
          class="flex gap-1"
        >

          <button
            onclick="sendCommand(${id}, 'open')"
            class="bg-green-600
                   hover:bg-green-500
                   px-3 py-1
                   rounded
                   text-xs
                   font-bold"
          >
            OPEN
          </button>


          <button
            onclick="sendCommand(${id}, 'close')"
            class="bg-red-600
                   hover:bg-red-500
                   px-3 py-1
                   rounded
                   text-xs
                   font-bold"
          >
            CLOSE
          </button>

        </div>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- PUMP -->
    <!-- ================================================= -->

    <div
      class="bg-slate-900
             rounded-lg
             p-3
             border border-slate-700"
    >

      <div
        class="flex
               justify-between
               items-center"
      >

        <div
          class="flex
                 items-center
                 gap-2"
        >

          <span
            class="text-sm
                   font-bold
                   text-slate-300"
          >
            PUMP
          </span>


          <span
            class="
              inline-flex
              items-center
              gap-2
              px-2
              py-1
              rounded-full
              border
              text-xs
              font-bold
              ${pumpClass}
            "
          >

            <span
              class="dot ${pumpDot}"
            ></span>

            ${pumpText}

          </span>

        </div>


        <div
          class="flex gap-1"
        >

          <button
            onclick="sendCommand(${id}, 'pump_on')"
            class="bg-green-600
                   hover:bg-green-500
                   px-3 py-1
                   rounded
                   text-xs
                   font-bold"
          >
            ON
          </button>


          <button
            onclick="sendCommand(${id}, 'pump_off')"
            class="bg-red-600
                   hover:bg-red-500
                   px-3 py-1
                   rounded
                   text-xs
                   font-bold"
          >
            OFF
          </button>

        </div>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- RSSI -->
    <!-- ================================================= -->

    <div
      class="text-center
             text-xs
             text-slate-500
             mt-3"
    >

      RSSI:
      ${rssi} dBm

    </div>

  </div>

  `;

}


// ============================================================
// SEND COMMAND
// ============================================================

function sendCommand(
  id,
  command
) {

  if (
    !mqttClient ||
    !mqttClient.connected
  ) {

    console.warn(
      "MQTT is not connected"
    );

    return;
  }


  const message =
    JSON.stringify({

      id: Number(id),

      cmd: command

    });


  console.log(
    "Sending:",
    message
  );


  mqttClient.publish(
    MQTT_CMD_TOPIC,
    message
  );

}


// ============================================================
// START MQTT
// ============================================================

connectMQTT();

</script>

</body>
</html>
