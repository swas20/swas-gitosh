<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaSense - Online Only Controls</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
html,body{height:100%; overflow:hidden}
body{display:flex; flex-direction:column}
#customerGrid{overflow-y:auto}
#customerGrid::-webkit-scrollbar{width:6px}
#customerGrid::-webkit-scrollbar-thumb{background:#334155; border-radius:10px}
.water-fill{transition:height 0.8s ease; position:absolute; bottom:0; left:0; right:0}
</style>
</head>
<body class="bg-slate-900 text-white h-screen">
<div class="flex flex-col h-screen max-w- mx-auto w-full px-3 py-2 gap-2">

<header class="bg-slate-800 rounded-xl px-4 py-2 flex justify-between items-center shrink-0">
<div class="flex items-center gap-4">
<h1 class="text-xl font-bold">AQUASENSE</h1>
<p class="text-cyan-400 text-xs hidden md:block">MASTER DASHBOARD</p>
</div>
<div class="flex items-center gap-3">
<span id="nodeCount" class="font-bold text-cyan-400 text-sm">0</span><span class="text-xs text-slate-400">nodes</span>
<span id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500"></span>
<span id="statusText" class="text-xs">Connecting...</span>
</div>
</header>

<div id="customerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 content-start flex-1">
<div class="col-span-full bg-slate-800 rounded-xl p-10 text-center text-slate-400">Waiting for nodes...</div>
</div>

</div>

<script>
const MQTT_BROKER="wss://broker.hivemq.com:8884/mqtt";
const MQTT_LIVE_TOPIC="aquasense/moses_kaaga_9x7p2/live";
const MQTT_CMD_TOPIC="aquasense/moses_kaaga_9x7p2/cmd";
const TANK_HEIGHT_CM=100;
let mqttClient=null; const nodes={};

function connectMQTT(){
  document.getElementById("statusText").textContent="Connecting...";
  mqttClient=mqtt.connect(MQTT_BROKER,{reconnectPeriod:3000,connectTimeout:10000,clean:true});
  mqttClient.on("connect",()=>{document.getElementById("statusText").textContent="MQTT Connected"; document.getElementById("statusDot").className="w-2 h-2 rounded-full bg-green-500"; mqttClient.subscribe(MQTT_LIVE_TOPIC);});
  mqttClient.on("message",(t,m)=>{ if(t!==MQTT_LIVE_TOPIC) return; try{processLiveData(JSON.parse(m.toString()))}catch(e){}});
  mqttClient.on("error",()=>{document.getElementById("statusText").textContent="Error"; document.getElementById("statusDot").className="w-2 h-2 rounded-full bg-red-500";});
}
function getTankMetrics(node){
  const d=node.ultrasonic??node.ultra??node.distance??node.dist_cm??null;
  const l=node.tank??node.tank_level??node.level??node.water_level??node.tank_percent??null;
  let dist=0,pct=0;
  if(l!==null&&!isNaN(l)){pct=Number(l); dist=d!==null?Number(d):(TANK_HEIGHT_CM-(pct/100)*TANK_HEIGHT_CM);}
  else if(d!==null){dist=Number(d); pct=100-(dist/TANK_HEIGHT_CM*100);}
  pct=Math.max(0,Math.min(100,pct)); return {distanceCm:dist.toFixed(0), levelPct:pct.toFixed(0), levelNum:pct};
}
function processLiveData(data){ if(!data||!Array.isArray(data.nodes)) return; data.nodes.forEach(n=>{if(n.id!=null) nodes[n.id]={...n}}); renderDashboard(); }
function isOnline(n){ return n.online===true||n.online===1||n.online==="true"||n.online==="1"; }
function renderDashboard(){
  const ids=Object.keys(nodes);
  document.getElementById("nodeCount").textContent=ids.length;
  const grid=document.getElementById("customerGrid");
  if(ids.length===0){ grid.innerHTML=`<div class="col-span-full bg-slate-800 rounded-xl p-10 text-center text-slate-400">Waiting...</div>`; return; }
  grid.innerHTML=ids.map(id=>createNodeCard(nodes[id])).join("");
}

function createNodeCard(node){
  const id=node.id;
  const online=isOnline(node);
  const flow=Number(node.flow||0).toFixed(1);
  const total=Number(node.total||0).toFixed(0);
  const m1=Number(node.m1||node.moist1||0).toFixed(0);
  const m2=Number(node.m2||node.moist2||0).toFixed(0);
  const temp=Number(node.temp||0).toFixed(0);
  const hum=Number(node.hum||0).toFixed(0);
  const valve=String(node.valve||"close").toLowerCase();
  const pump=String(node.pump||"off").toLowerCase();
  const {distanceCm,levelPct,levelNum}=getTankMetrics(node);

  let waterColor, badge, status;
  if(levelNum<10){ waterColor="linear-gradient(to top,#ef4444,#dc2626)"; badge="bg-red-500/20 text-red-400"; status="CRIT"; }
  else if(levelNum<30){ waterColor="linear-gradient(to top,#f59e0b,#f97316)"; badge="bg-amber-500/20 text-amber-400"; status="LOW"; }
  else if(levelNum<70){ waterColor="linear-gradient(to top,#22d3ee,#3b82f6)"; badge="bg-cyan-500/20 text-cyan-400"; status="OK"; }
  else { waterColor="linear-gradient(to top,#60a5fa,#2563eb)"; badge="bg-blue-500/20 text-blue-300"; status="FULL"; }

  // INDICATOR LOGIC - ONLY FOR ONLINE
  const valveIndicator = online? `
    <div class="bg-slate-900 rounded-lg px-2 py-1.5 flex justify-between items-center border ${valve==='open'?'border-green-500/50 bg-green-500/10':'border-red-500/30'}">
      <span class="text- font-bold tracking-widest ${valve==='open'?'text-green-400':'text-red-400'}">● VALVE ${valve.toUpperCase()}</span>
      <span class="text- ${valve==='open'?'text-green-300':'text-slate-500'}">${valve==='open'?'OPEN':'CLOSED'}</span>
    </div>` : '';

  const pumpIndicator = online? `
    <div class="bg-slate-900 rounded-lg px-2 py-1.5 flex justify-between items-center border ${pump==='on'?'border-green-500/50 bg-green-500/10':'border-slate-700'}">
      <span class="text- font-bold tracking-widest ${pump==='on'?'text-green-400':'text-slate-400'}">● PUMP ${pump.toUpperCase()}</span>
      <span class="text- ${pump==='on'?'text-green-300':'text-slate-500'}">${pump==='on'?'RUNNING':'STOPPED'}</span>
    </div>` : '';

  const controls = online? `
    <div class="mt-auto grid grid-cols-2 gap-1">
      <div class="flex gap-1">
        <button onclick="sendCommand(${id},'open')" class="flex-1 ${valve==='open'?'bg-green-600 ring-1 ring-green-400':'bg-slate-700'} hover:bg-green-500 text- py-1.5 rounded font-bold transition">VALVE OPEN</button>
        <button onclick="sendCommand(${id},'close')" class="flex-1 ${valve==='close'?'bg-red-600 ring-1 ring-red-400':'bg-slate-700'} hover:bg-red-500 text- py-1.5 rounded font-bold transition">CLOSE</button>
      </div>
      <div class="flex gap-1">
        <button onclick="sendCommand(${id},'pump_on')" class="flex-1 ${pump==='on'?'bg-green-600 ring-1 ring-green-400':'bg-slate-700'} hover:bg-green-500 text- py-1.5 rounded font-bold transition">PUMP ON</button>
        <button onclick="sendCommand(${id},'pump_off')" class="flex-1 ${pump==='off'?'bg-slate-600 ring-1 ring-slate-400':'bg-slate-700'} hover:bg-slate-600 text- py-1.5 rounded font-bold transition">OFF</button>
      </div>
    </div>` : `
    <div class="mt-auto bg-red-900/20 border border-red-500/30 rounded-lg p-3 text-center">
      <p class="text-xs font-bold text-red-400">● NODE OFFLINE</p>
      <p class="text- text-slate-400 mt-1">Pump & Valve controls hidden</p>
    </div>`;

  return `
  <div class="bg-slate-800 border ${online?'border-slate-700':'border-red-900/50 opacity-70'} rounded-xl p-3 flex flex-col h- shrink-0">
    <div class="flex justify-between items-center mb-2">
      <h2 class="font-bold text-sm">Customer ${id}</h2>
      <div class="flex gap-1 items-center">
        <span class="text- px-1.5 py-0.5 rounded border ${badge}">${status} ${levelPct}%</span>
        <span class="text- px-2 py-0.5 rounded-full font-bold ${online?'bg-green-500 text-black':'bg-red-500 text-white'}">${online?'ONLINE':'OFFLINE'}</span>
      </div>
    </div>

    <div class="grid grid-cols-[1fr_70px] gap-2 mb-2">
      <div class="space-y-1.5">
        <div class="bg-slate-900 rounded-lg px-2 py-1 flex justify-between"><span class="text- text-slate-400">FLOW</span><span class="text-sm font-bold text-cyan-400">${flow} L/m</span></div>
        <div class="bg-slate-900 rounded-lg px-2 py-1 flex justify-between"><span class="text- text-slate-400">TOTAL</span><span class="text-sm font-bold text-blue-400">${total} L</span></div>
        ${valveIndicator}
        ${pumpIndicator}
      </div>
      <div style="width:70px; height:110px; background:#1e293b; border:2px solid #475569; border-radius:6px 6px 12px 12px; position:relative; overflow:hidden;">
        <div class="water-fill" style="height:${levelPct}%; background:${waterColor};"><div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:10px; text-shadow:0 1px 1px black;">${levelNum>25?levelPct+'%':''}</div></div>
      </div>
    </div>

    <div class="bg-slate-900/50 rounded-lg p-1.5 mb-2">
      <div class="flex justify-between text- text-slate-400 mb-1"><span>ULTRA ${distanceCm}cm</span><span>LEVEL ${levelPct}%</span></div>
      <div style="height:4px; background:#334155; border-radius:2px; overflow:hidden;"><div style="height:100%; width:${levelPct}%; background:${waterColor};"></div></div>
    </div>

    <div class="grid grid-cols-4 gap-1 mb-2">
      <div class="bg-slate-900 rounded px-1 py-1 text-center"><p class="text- text-slate-400">M1</p><p class="text- font-bold text-green-400">${m1}%</p></div>
      <div class="bg-slate-900 rounded px-1 py-1 text-center"><p class="text- text-slate-400">M2</p><p class="text- font-bold text-green-400">${m2}%</p></div>
      <div class="bg-slate-900 rounded px-1 py-1 text-center"><p class="text- text-slate-400">TEMP</p><p class="text- font-bold text-yellow-400">${temp}°</p></div>
      <div class="bg-slate-900 rounded px-1 py-1 text-center"><p class="text- text-slate-400">HUM</p><p class="text- font-bold text-cyan-400">${hum}%</p></div>
    </div>

    ${controls}
    <div class="text- text-slate-500 text-center mt-1">RSSI ${node.rssi||0}dBm • ${online?'● LIVE CONTROLS':'○ OFFLINE'}</div>
  </div>`;
}
function sendCommand(id,cmd){ if(!mqttClient||!mqttClient.connected){alert("MQTT offline");return;} mqttClient.publish(MQTT_CMD_TOPIC,JSON.stringify({id:Number(id),cmd:cmd})); }
connectMQTT();
setTimeout(()=>{ if(Object.keys(nodes).length===0){ processLiveData({nodes:[{id:1,online:true,flow:5.2,total:120,ultrasonic:20,tank_level:80,m1:60,m2:65,temp:24,hum:60,rssi:-60,valve:"open",pump:"on"},{id:2,online:false,flow:0,total:45,ultrasonic:70,tank_level:30,m1:30,m2:35,temp:26,hum:55,rssi:-75,valve:"close",pump:"off"},{id:3,online:true,flow:1.1,total:200,ultrasonic:15,tank_level:85,m1:70,m2:75,temp:23,hum:65,rssi:-55,valve:"close",pump:"off"},{id:4,online:true,flow:2.2,total:80,ultrasonic:95,tank_level:5,m1:20,m2:22,temp:28,hum:50,rssi:-80,valve:"close",pump:"off"}]}); } },1500);
</script>
</body>
</html>
